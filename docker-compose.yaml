adminer:
    image: adminer

    ports:
      - "8080:8080"

    depends_on:
      - db

  etl:
    build: .

    env_file:
      - .env

    depends_on:
      - db

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    depends_on:
      - db

    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: